version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - corepack enable
            - corepack prepare pnpm@8.8.0 --activate
            - pnpm install --frozen-lockfile
        build:
          commands:
            - pnpm --filter @expense-tracker/web run build
      artifacts:
        baseDirectory: dist
        files:
          - "**/*"
      cache:
        paths:
          - ../../node_modules/.pnpm/**/*
          - node_modules/**/*
